name: scheduled-checks

on:
  schedule:
    # Runs every day at 05:00 UTC
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix e2e

      - name: Backend unit tests
        run: npm test --prefix backend

      - name: Frontend build
        run: npm run build --prefix frontend

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm test --prefix e2e

      - name: Install Lighthouse
        run: npm install -g lighthouse

      - name: Wait for app readiness
        run: |
          url="https://calendar-booking-camd.onrender.com/event-types"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url")
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "App is ready"
              exit 0
            fi
            sleep 10
          done
          echo "App did not become ready in time" >&2
          exit 1

      - name: Run Lighthouse
        run: |
          mkdir -p lighthouse
          lighthouse https://calendar-booking-camd.onrender.com \
            --output=html \
            --output=json \
            --output-path=./lighthouse/lighthouse \
            --chrome-path="$(command -v google-chrome)" \
            --chrome-flags="--headless --no-sandbox --disable-gpu"

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: |
            lighthouse/lighthouse.report.html
            lighthouse/lighthouse.report.json
          retention-days: 7